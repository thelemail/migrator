name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    secrets:
      TRUST_READ_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.TRUST_READ_TOKEN }}

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Check that go.mod is tidy and has no local replacements
        run: |
          set -euo pipefail
          go mod tidy -diff
          if grep -q '^replace' go.mod; then
            echo "go.mod still replaces a module with a local path" >&2
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags localstack ./...
          go vet -tags e2e,localstack ./...

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.15.0
          working-directory: engine

      - name: Test
        run: go test -race ./...

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.TRUST_READ_TOKEN }}

      - name: Linux libraries for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libx11-xcb-dev libasound2-dev

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format and lint
        if: runner.os == 'macOS'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Test the app
        run: cargo test --locked

      - name: Test the engine on this platform
        working-directory: engine
        run: go test ./...

      - name: Release build
        shell: bash
        run: ./scripts/build-release.sh
