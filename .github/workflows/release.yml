name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the signed release tag and its version
        env:
          TAG: ${{ github.ref_name }}
          FINGERPRINT: ${{ vars.RELEASE_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ -z "$FINGERPRINT" ]; then
            echo "RELEASE_SIGNING_FINGERPRINT is not set." >&2
            exit 1
          fi
          test "$(git cat-file -t "refs/tags/${TAG}")" = tag
          gpg --import .github/release-signing-key.asc
          git verify-tag --raw "refs/tags/${TAG}" 2>&1 | grep -q "VALIDSIG ${FINGERPRINT}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "v${version}" = "$TAG"

  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    secrets:
      TRUST_READ_TOKEN: ${{ secrets.TRUST_READ_TOKEN }}

  macos:
    needs: verify
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: engine/go.mod
          cache: false

      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.TRUST_READ_TOKEN }}

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable

      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -P "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$api_key"
          xcrun notarytool store-credentials thelemail-notary --key "$api_key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --keychain "$keychain"
          rm -P "$api_key"

      - name: Keep Apple ticket lookups on TCP
        run: |
          set -euo pipefail
          echo "block return out quick proto udp from any to any port 443" | sudo pfctl -f -
          sudo pfctl -E

      - name: Build, sign and notarize
        env:
          IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          make notarize IDENTITY="$IDENTITY" NOTARY_PROFILE=thelemail-notary
          spctl --assess --type execute --verbose "dist/Thelemail Migrator.app"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/Thelemail-Migrator-*-macos.zip
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-2025
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: engine/go.mod
          cache: false

      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.TRUST_READ_TOKEN }}

      - name: Build
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          ./scripts/build-release.sh

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: VERSION="${TAG#v}" ./scripts/package.sh windows

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/thelemail-migrator-*-windows-x86_64.zip
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: engine/go.mod
          cache: false

      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.TRUST_READ_TOKEN }}

      - name: Build and package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libx11-xcb-dev libasound2-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
          ./scripts/build-release.sh
          VERSION="${TAG#v}" ./scripts/package.sh linux

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/thelemail-migrator-*-linux-x86_64.tar.gz
          if-no-files-found: error

  provenance:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: engine/go.mod
          cache: false

      - uses: ./.github/actions/private-modules
        with:
          token: ${{ secrets.TRUST_READ_TOKEN }}

      - name: Build the engines twice and compare
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export VERSION="${TAG#v}"
          ./scripts/engine-checksums.sh "$RUNNER_TEMP/first"
          go clean -cache
          ./scripts/engine-checksums.sh "$RUNNER_TEMP/second"
          diff "$RUNNER_TEMP/first/ENGINE-SHA256SUMS" "$RUNNER_TEMP/second/ENGINE-SHA256SUMS"
          mkdir -p dist/provenance
          cp "$RUNNER_TEMP/first/ENGINE-SHA256SUMS" dist/provenance/

      - name: Source bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/provenance/sbom.source.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Source archive and release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          git -c tar.tar.gz.command='gzip -cn' archive \
            --format=tar.gz \
            --prefix="thelemail-migrator-${version}/" \
            -o "dist/provenance/thelemail-migrator-${version}-source.tar.gz" \
            "refs/tags/${TAG}"
          jq -n --arg tag "$TAG" --arg commit "$GITHUB_SHA" --arg go "$(go env GOVERSION)" \
                '{tag: $tag, commit: $commit, goVersion: $go, engineBuildScript: "scripts/engine-checksums.sh"}' \
            > dist/provenance/release-metadata.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: dist/provenance/*
          if-no-files-found: error

  publish:
    needs: [macos, windows, linux, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          shasum -a 256 -- * | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/SHA256SUMS
          sbom-path: dist/sbom.source.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'The engine binaries are reproducible: check out this tag, run scripts/engine-checksums.sh with the Go version in release-metadata.json, and compare with ENGINE-SHA256SUMS.\n'
            printf 'The Linux archive ships the engine unchanged. The macOS and Windows builds carry the same engine with a code signature added.\n'
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md dist/*
